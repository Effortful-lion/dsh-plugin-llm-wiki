# 发布到 npm：用 npm 的 trusted publishing（OIDC），不需要在 CI 里放 token。
#
# 一次性配置（在 npmjs.com 上，由包所有者做）：
#   Package → Settings → Trusted Publisher → GitHub Actions
#     Organization or user: Effortful-lion
#     Repository:           dsh-plugin-llm-wiki
#     Workflow filename:    publish.yml
#     Environment:          （留空）
# 配好之后，推一个 v* 标签（或手动 Run workflow）就会自动发布当前版本。
#
# 没有配 trusted publisher 时这个工作流会失败——这是预期的：
# 它不会把 NPM_TOKEN 当作后备手段，因为 npm 正在收紧「绕过 2FA 的 token」。

name: publish

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # OIDC：trusted publishing 的凭据来源

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # npm 11 才带 trusted publishing（OIDC）支持
      - run: npm install -g npm@^11

      - run: npm ci --ignore-scripts || npm install --no-audit --no-fund

      - run: npm run build

      - run: npm run test
        env:
          # integration 里的媒体/PDF 用例会在缺依赖时自动跳过，不需要额外密钥
          CI: '1'

      # prepublishOnly 会再跑一次构建；--provenance 生成可校验的构建来源
      - run: npm publish --provenance --access public
